<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1320">
<title>Battleship · Match over</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#DDF0FF; --sea:#2F8FE0; --sea-deep:#1E6FBF; --ink:#14325A; --paper:#FFFFFF;
  --sun:#FFC83D; --coral:#FF4F5E; --kelp:#34C3A0; --lilac:#A98BFF; --peach:#FFA26B;
  --mist:#E6F1FB; --muted:#5B7493;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#BFE0FA;font-family:'Nunito','Trebuchet MS',system-ui,sans-serif;color:var(--ink);min-width:1320px;padding:20px 0}
.app{width:1280px;height:800px;margin:0 auto;position:relative;overflow:hidden;background:var(--sky);
  border:4px solid var(--ink);border-radius:26px;padding:26px 40px}
.app > *:not(.waves):not(.bubbles){position:relative;z-index:2}
.waves{position:absolute;left:0;right:0;bottom:0;height:110px;z-index:0}
.bubbles span{position:absolute;border:3px solid #fff;border-radius:50%;opacity:.7;z-index:1}
h1,h2,h3,.display{font-family:'Baloo 2','Trebuchet MS',sans-serif;line-height:1.05}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:'Baloo 2','Trebuchet MS',sans-serif;
  font-weight:800;font-size:22px;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:16px;
  box-shadow:0 6px 0 var(--ink);padding:8px 28px 6px;cursor:pointer}
.btn.coral{background:var(--coral);color:#fff}
.btn.white{background:#fff}
.btn.small{font-size:17px;padding:4px 16px 2px;box-shadow:0 4px 0 var(--ink);border-radius:12px}
.btn.pressed{box-shadow:0 2px 0 var(--ink);transform:translateY(4px);background:var(--mist);color:var(--muted)}
.btn.disabled{background:var(--mist);color:var(--muted);box-shadow:0 6px 0 #9DB4CC;border-color:#9DB4CC}
.pill{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px;background:#fff;border:2.5px solid var(--ink);
  border-radius:999px;padding:4px 14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--kelp);border:2px solid var(--ink)}
.dot.sun{background:var(--sun)} .dot.coral{background:var(--coral)} .dot.grey{background:#C3D3E3}
.avatar{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;flex:none}
.logo{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:30px;letter-spacing:.5px;color:var(--ink)}
.logo b{display:inline-block;transform:rotate(-4deg);color:var(--sea)}

/* boards */
.board{display:grid;grid-template-columns:22px auto;grid-template-rows:22px auto;gap:4px}
.board .cols{grid-column:2;display:grid;grid-template-columns:repeat(8,var(--cell));padding:0 3px}
.board .rows{grid-row:2;display:grid;grid-template-rows:repeat(8,var(--cell));padding:3px 0}
.board .cols span,.board .rows span{display:grid;place-items:center;font-weight:900;font-size:13px;color:var(--muted)}
.water{position:relative;background:var(--sea);border:3px solid var(--ink);border-radius:14px;overflow:hidden;
  display:grid;grid-template-columns:repeat(8,var(--cell));grid-template-rows:repeat(8,var(--cell));
  box-shadow:5px 5px 0 var(--ink)}
.water.enemy{background:var(--sea-deep)}
.cell{border-right:1.5px solid rgba(255,255,255,.28);border-bottom:1.5px solid rgba(255,255,255,.28)}
.cell:nth-child(8n){border-right:0}
.cell:nth-child(n+57){border-bottom:0}
.ship{position:absolute;z-index:1;border:3px solid var(--ink);border-radius:999px;
  background-repeat:no-repeat}
.ship .ports{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-around}
.ship.v .ports{flex-direction:column}
.ship .ports i{width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--ink)}
.ship.sunk{background:#8DA2B8 !important;opacity:.95}
.ship.sunk .ports i{background:#5E7187}
.ship.ghost{background:rgba(52,195,160,.25) !important;border:3px dashed #fff}
.ship.ghost .ports i{opacity:.5}
.mk{position:absolute;z-index:3;display:grid;place-items:center;pointer-events:none}
.mk.hit .b{width:72%;height:72%;border-radius:50%;background:var(--coral);border:3px solid var(--ink);
  display:grid;place-items:center;color:#fff;font-weight:900;font-family:'Baloo 2',sans-serif;font-size:calc(var(--cell)*.42);line-height:1}
.mk.miss .b{width:34%;height:34%;border-radius:50%;background:transparent;border:3px solid #fff;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.mk.aim .b{width:86%;height:86%;border-radius:12px;border:3.5px dashed var(--sun);background:rgba(255,200,61,.18)}
.mk.aim .b::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--sun);border:2.5px solid var(--ink)}
.mk.aim .b{display:grid;place-items:center}
.legend{display:flex;gap:18px;align-items:center;font-weight:800;font-size:14px}
.legend .sw{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:6px}

.app{padding:24px 34px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.screen{padding:0;overflow:hidden;height:600px;display:flex;flex-direction:column}
.screen .cap{background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:8px 18px;display:flex;gap:8px;align-items:center}
.screen .cap i{width:12px;height:12px;border-radius:50%;background:#fff;opacity:.4}
.screen .in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 30px;text-align:center;position:relative}
.screen.win .in{background:radial-gradient(circle at 50% 30%, #FFF3C7 0 40%, #fff 41%)}
.status{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:120px;line-height:.95;color:#fff;-webkit-text-stroke:6px var(--ink);
  paint-order:stroke fill;text-shadow:7px 7px 0 var(--ink);margin:8px 0 4px}
.win .status{color:var(--sun);transform:rotate(-4deg)}
.lost .status{color:#8DA2B8;transform:rotate(3deg)}
.line{font-size:19px;font-weight:800;margin-bottom:22px}
.scores{display:flex;align-items:center;gap:20px;margin-bottom:26px}
.sc{border:3px solid var(--ink);border-radius:18px;padding:10px 22px;min-width:150px;background:#fff;box-shadow:4px 4px 0 var(--ink)}
.sc .n{font-weight:900;font-size:16px}
.sc .v{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:54px;line-height:1}
.sc.lead{background:var(--sun)}
.vs{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:28px}
.screen .btn{font-size:28px;padding:10px 54px}
.note{margin-top:22px;font-size:15px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:8px}
.conf{position:absolute;width:14px;height:22px;border:2.5px solid var(--ink);border-radius:4px}
</style></head>
<body><div class="app"><svg class="waves" viewBox="0 0 1280 110" preserveAspectRatio="none">
<path d="M0 40 Q 80 10 160 40 T 320 40 T 480 40 T 640 40 T 800 40 T 960 40 T 1120 40 T 1280 40 V110 H0Z" fill="#9CCDF3"/>
<path d="M0 68 Q 80 42 160 68 T 320 68 T 480 68 T 640 68 T 800 68 T 960 68 T 1120 68 T 1280 68 V110 H0Z" fill="#2F8FE0" stroke="#14325A" stroke-width="3"/>
</svg>
<div class="top"><div class="logo"><b>Battle</b>ship</div><span class="pill">Match 3 is over</span></div>
<div class="duo">
 <div class="card screen win"><div class="cap"><i></i><i></i><i></i>&nbsp;Alice's screen</div><div class="in"><span class="conf" style="left:60px;top:40px;background:var(--coral);transform:rotate(20deg)"></span><span class="conf" style="left:120px;top:120px;background:var(--kelp);transform:rotate(-30deg)"></span><span class="conf" style="left:470px;top:60px;background:var(--lilac);transform:rotate(40deg)"></span><span class="conf" style="left:520px;top:150px;background:var(--sun);transform:rotate(-15deg)"></span><span class="conf" style="left:40px;top:220px;background:var(--sun);transform:rotate(60deg)"></span><span class="conf" style="left:510px;top:260px;background:var(--coral);transform:rotate(-50deg)"></span><span class="conf" style="left:90px;top:330px;background:var(--lilac);transform:rotate(10deg)"></span><span class="conf" style="left:500px;top:380px;background:var(--kelp);transform:rotate(35deg)"></span>
  <div class="status">Win</div>
  <div class="line">You sank all 4 of Bob's ships!</div>
  <div class="scores"><div class="sc lead"><div class="n">Alice</div><div class="v">2</div></div><div class="vs">vs</div><div class="sc"><div class="n">Bob</div><div class="v">1</div></div></div>
  <a class="btn">Rematch</a>
  <div class="note"><span class="dot"></span>Bob wants a rematch. You'll fire first as the winner.</div>
 </div></div>
 <div class="card screen lost"><div class="cap"><i></i><i></i><i></i>&nbsp;Bob's screen</div><div class="in">
  <div class="status">Lost</div>
  <div class="line">Alice sank your whole fleet this time.</div>
  <div class="scores"><div class="sc lead"><div class="n">Alice</div><div class="v">2</div></div><div class="vs">vs</div><div class="sc"><div class="n">Bob</div><div class="v">1</div></div></div>
  <a class="btn pressed">Rematch requested</a>
  <div class="note"><span class="dot sun"></span>Waiting for Alice to accept…</div>
 </div></div>
</div></div></body></html>
